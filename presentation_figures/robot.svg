<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" width="1200" height="1520" role="img" aria-label="Flat vector illustration of a friendly robot agent">
<title>Robot agent</title>

<defs>
  <clipPath id="head-clip">
    <rect x="168" y="120" width="264" height="182" rx="36"/>
  </clipPath>
  <clipPath id="body-clip">
    <rect x="148" y="330" width="304" height="250" rx="42"/>
  </clipPath>
</defs>

<g stroke="#495057" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">

  <!-- ground shadow -->
  <ellipse cx="300" cy="716" rx="158" ry="18" fill="#E9ECEF" stroke="none"/>

  <!-- antenna -->
  <line x1="300" y1="120" x2="300" y2="80"/>
  <circle cx="300" cy="62" r="18" fill="#D97706"/>

  <!-- ears -->
  <rect x="140" y="192" width="30" height="60" rx="15" fill="#0891B2"/>
  <rect x="430" y="192" width="30" height="60" rx="15" fill="#0891B2"/>

  <!-- head -->
  <rect x="168" y="120" width="264" height="182" rx="36" fill="#F8F9FA"/>
  <g clip-path="url(#head-clip)">
    <rect x="168" y="120" width="264" height="46" fill="#2563EB" stroke="none"/>
  </g>
  <rect x="168" y="120" width="264" height="182" rx="36" fill="none"/>

  <!-- visor -->
  <rect x="196" y="184" width="208" height="92" rx="26" fill="#495057"/>
  <circle cx="256" cy="230" r="24" fill="#0891B2" stroke="none"/>
  <circle cx="344" cy="230" r="24" fill="#0891B2" stroke="none"/>
  <circle cx="248" cy="222" r="8" fill="#F8F9FA" stroke="none"/>
  <circle cx="336" cy="222" r="8" fill="#F8F9FA" stroke="none"/>

  <!-- neck -->
  <rect x="270" y="298" width="60" height="34" rx="12" fill="#ADB5BD"/>

  <!-- shoulders and arms -->
  <rect x="96" y="386" width="52" height="150" rx="26" fill="#ADB5BD"/>
  <rect x="452" y="386" width="52" height="150" rx="26" fill="#ADB5BD"/>
  <circle cx="122" cy="392" r="30" fill="#6C757D"/>
  <circle cx="478" cy="392" r="30" fill="#6C757D"/>
  <!-- grippers: palm plus two prongs -->
  <rect x="94" y="530" width="56" height="30" rx="12" fill="#7C3AED"/>
  <rect x="98" y="556" width="18" height="26" rx="8" fill="#7C3AED"/>
  <rect x="128" y="556" width="18" height="26" rx="8" fill="#7C3AED"/>
  <rect x="450" y="530" width="56" height="30" rx="12" fill="#7C3AED"/>
  <rect x="454" y="556" width="18" height="26" rx="8" fill="#7C3AED"/>
  <rect x="484" y="556" width="18" height="26" rx="8" fill="#7C3AED"/>

  <!-- torso -->
  <rect x="148" y="330" width="304" height="250" rx="42" fill="#FFFFFF"/>
  <g clip-path="url(#body-clip)">
    <rect x="148" y="330" width="304" height="34" fill="#DEE2E6" stroke="none"/>
  </g>
  <rect x="148" y="330" width="304" height="250" rx="42" fill="none"/>

  <!-- chest display with signal bars -->
  <rect x="182" y="388" width="150" height="104" rx="16" fill="#EFF6FF"/>
  <g stroke="none">
    <rect x="204" y="446" width="20" height="28" rx="5" fill="#2563EB"/>
    <rect x="234" y="424" width="20" height="50" rx="5" fill="#059669"/>
    <rect x="264" y="404" width="20" height="70" rx="5" fill="#D97706"/>
    <rect x="294" y="434" width="20" height="40" rx="5" fill="#BE185D"/>
  </g>
  <rect x="182" y="388" width="150" height="104" rx="16" fill="none"/>

  <!-- power core -->
  <circle cx="388" cy="440" r="38" fill="#FEF3C7"/>
  <circle cx="388" cy="440" r="18" fill="#D97706" stroke="none"/>

  <!-- status lights -->
  <g stroke-width="5">
    <circle cx="228" cy="534" r="13" fill="#DC2626"/>
    <circle cx="278" cy="534" r="13" fill="#D97706"/>
    <circle cx="328" cy="534" r="13" fill="#059669"/>
  </g>

  <!-- legs and feet -->
  <rect x="200" y="578" width="62" height="86" rx="20" fill="#ADB5BD"/>
  <rect x="338" y="578" width="62" height="86" rx="20" fill="#ADB5BD"/>
  <rect x="168" y="654" width="118" height="44" rx="20" fill="#495057"/>
  <rect x="314" y="654" width="118" height="44" rx="20" fill="#495057"/>

</g>
</svg>
