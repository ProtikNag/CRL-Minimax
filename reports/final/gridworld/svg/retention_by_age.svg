if; font-size: 11.5px; fill: rgb(173, 181, 189); fill-opacity: 1; white-space: pre;"><tspan style="font-weight:bold">From-scratch</tspan></text></g></g></g><g class="annotation" data-index="4" style="opacity: 1;"><g class="annotation-text-g" transform="rotate(0,319,335.81)"><g class="cursor-pointer" transform="translate(8,312)"><rect class="bg" x="0.5" y="0.5" width="621" height="46" style="stroke-width: 1px; stroke: rgb(0, 0, 0); stroke-opacity: 0; fill: rgb(0, 0, 0); fill-opacity: 0;"/><text class="annotation-text" text-anchor="start" x="2" y="10" style="font-family: Inter, Helvetica, Arial, sans-serif; font-size: 8.5px; fill: rgb(108, 117, 125); fill-opacity: 1; white-space: pre;"><tspan class="line" dy="0em" x="2" y="10">Every matrix cell pooled by age, where age 0 is the task just learned. Ages with fewer than 5 contributing cells are dropped, so the tail is not one noisy task.</tspan><tspan class="line" dy="1.3em" x="2" y="10">Ours pools 3 seeds, the rest 1 each.</tspan><tspan class="line" dy="2.6em" x="2" y="10"><tspan style="font-weight:bold">The crossing near age 2 is the whole trade.</tspan> Ours learns a new task to a markedly lower immediate level, then climbs and holds; the others start higher and decay.</tspan><tspan class="line" dy="3.9000000000000004em" x="2" y="10">Plasticity is what ours pays, retention is what it buys.</tspan></text></g></g></g></g></svg>