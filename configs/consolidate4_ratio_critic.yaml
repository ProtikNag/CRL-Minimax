# Ratio-constraint consolidation with CRITIC-based per-iteration values.
#   * constraint value V_G read from the trained critic on 50 no-op + 50
#     intermediate cached states -> ~ms/iter, so constraint_every=1 is affordable
#   * RATIO (relative) constraint form: sf = max(0, V_E-V_G)/max(|V_E|,tau),
#     tolerance delta=5% via the dual threshold eps=delta^2=0.0025
#   * dual mu BOUNDED to 100 (crude anti-explosion guard, per decision)
#   * periodic MC calibration (every 200 iters) logs critic-vs-MC drift
#   * 4 easiest/shortest games, global_iters 3000, gamma 0.999
experiment:
  name: consolidate4_ratio_critic
  seed: 0
  results_dir: results
  device: auto
  log_every: 1
env:
  family: atari
  params:
    gamma: 0.999
    max_steps: 0
    frame_skip: 4
    frame_stack: 4
    noop_max: 50
    terminal_on_life_loss: false
    repeat_action_probability: 0.0
    clip_rewards: true
  tasks:
  - game: Pong
    threshold: 18
  - game: Boxing
    threshold: 90
  - game: Freeway
    threshold: 30
  - game: SpaceInvaders
    threshold: 600
policy:
  kind: impala_ac_multihead
  hidden_sizes:
  - 512
  task_conditioned: false
duals:
  kind: projected_ascent
  lr: 0.3
  init: 0.0
  max_value: 100.0          # dual mu bounded to 100 (was 1000)
  warm_start: false
trainer:
  kind: ppo
  cycles_per_task: 1
  eps: 0.0025               # ratio tolerance: delta^2 = 0.05^2 (5% relative shortfall)
  eval_all_tasks: false
ppo:
  method: consolidate
  expert_dir: experts
  ref_fraction: 1.0
  constraint_greedy: true
  constraint_episodes: 100
  constraint_every: 1              # refresh V_G / shortfall / mu every iteration (critic = cheap)
  eval_episodes: 500
  eval_greedy: true
  eval_greedy_episodes: 500
  eval_seed: 100000
  async_envs: true          # subprocess-parallel ALE stepping (collect() = ~60% of iter)
  n_envs: 16
  n_steps: 128
  ppo_epochs: 4
  num_minibatches: 4
  clip_ratio: 0.1
  gae_lambda: 0.95
  vf_coef: 0.5
  ent_coef: 0.01
  max_grad_norm: 0.5
  lr: 0.00025
  normalize_advantage: true
  global_iters: 3000
  min_iters: 200
  eval_every: 0
  global_bc_coef: 0.0
  eval_noop_enumerate: true
  constraint_relative: true
  constraint_form: ratio          # relative shortfall (NOT floored); mu-cap guards explosion
  constraint_delta: 0.05
  constraint_tau: 0.5
  constraint_use_critic: true     # per-iteration V_G from the critic (cached states)
  constraint_calibrate_every: 200 # periodic true-MC check of critic drift
  expert_refs_path: results/expert_refs_g999_4.json
  constraint_intermediate_states: 50
  constraint_intermediate_path: results/intermediate_states_g999.json
  eval_max_ep_steps: 3000
  past_task_sampling: all
  past_monitor_every: 1           # per-iteration past-task retention monitor (critic = cheap)
  adapt_iters: 0
  warmstart_head_from_expert: true
