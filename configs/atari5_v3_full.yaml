# Part A -- MIN-MAX (experts NOT stored), VERSION 3 (from scratch, seed 0).
#   Sequence: Qbert -> Pong -> Breakout -> Boxing -> SpaceInvaders.
#   Fixes from the v2 diagnosis (Boxing PPO DIVERGED to a uniform/NaN policy at
#   ~it 4000: clipfrac ~0.5, approx_kl ~0.04-0.06 rising, then ent->ln(18), kl->0):
#     * target_kl = 0.03  -> KL early-stop prevents the runaway actor blow-up.
#     * ppo_epochs 4->3, lr 0.00025->0.0002 -> gentler per-batch updates.
#     * Boxing threshold 90->55 (its expert is only 65.7, so 90 was UNREACHABLE ->
#       it could never early-stop and always burned the full cap).
#   Per-task local budgets (sized from v1/v2 resource_usage.json). Local models
#   saved (local_after_task{k}.pt) -> local is the Part-A reference. Resume-capable.
experiment:
  name: atari5_v3_full
  seed: 0
  results_dir: results
  device: auto
  log_every: 25
env:
  family: atari
  params:
    gamma: 0.99
    max_steps: 0
    frame_skip: 4
    frame_stack: 4
    noop_max: 50
    terminal_on_life_loss: false
    repeat_action_probability: 0.0
    clip_rewards: true
  tasks:
  - game: Qbert
    threshold: 4000
  - game: Pong
    threshold: 18
  - game: Breakout
    threshold: 80
  - game: Boxing
    threshold: 55          # expert is 65.7; 90 was unreachable
  - game: SpaceInvaders
    threshold: 800
policy:
  kind: impala_ac_multihead
  hidden_sizes:
  - 512
  task_conditioned: false
duals:
  kind: projected_ascent
  lr: 0.3
  init: 0.0
  max_value: 1000.0
  warm_start: false
trainer:
  kind: ppo
  cycles_per_task: 1
  eps: 0.04
  eval_all_tasks: false
ppo:
  method: constrained
  async_envs: true
  n_envs: 16
  n_steps: 128
  ppo_epochs: 3            # was 4 (gentler updates)
  num_minibatches: 4
  clip_ratio: 0.1
  gae_lambda: 0.95
  vf_coef: 0.5
  ent_coef: 0.01
  max_grad_norm: 0.5
  lr: 0.0002              # was 0.00025
  target_kl: 0.03         # KL early-stop -> prevents the Boxing blow-up
  select_best_local: true # keep the best-greedy local model, not a collapsed final
  normalize_advantage: true
  task1_iters: 1500       # Qbert (early-stops ~950)
  local_iters: 3000       # default cap
  local_iters_per_task:   # per-game caps (from resource_usage.json)
    Pong: 1500
    Breakout: 3000
    Boxing: 4000
    SpaceInvaders: 3000
  global_iters: 2000
  min_iters: 500
  patience: 3
  stop_eval_every: 50
  stop_eval_episodes: 15
  past_task_sampling: all
  constraint_episodes: 16
  constraint_every: 20
  eval_max_ep_steps: 10000
  eval_noop_enumerate: false
  eval_episodes: 100
  eval_greedy: true
  eval_greedy_episodes: 100
  eval_seed: 100000
  eval_every: 0
