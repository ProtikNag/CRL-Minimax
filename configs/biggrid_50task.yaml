# === HARD 50-task BigGrid (50x50), PPO actor-critic backend (Lane A) ===
# Same code path as Atari (crl/ppo_continual.py): shared narrow trunk [64] +
# per-task actor+critic heads (mlp_ac_multihead). Critic feeds GAE advantages
# only; constraint V_i stays Monte-Carlo (paper-faithful). Difficulty from
# DYNAMICS: 50 spread goals, per-task slip {0,0.1,0.2,0.3} + obstacle density
# {0,0.08,0.15}. Reward = graded proximity in [0,1] (uniform magnitude ->
# returns O(1), single eps valid; ceiling defaults to 1.0). Local trains to
# threshold 0.85 or the iter cap; retention-gated global early-stop.
#   Run: python -m experiments.run --config configs/biggrid_50task.yaml --seed 0
