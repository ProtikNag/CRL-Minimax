experiment:
  name: consolidate10_strict_g999
  seed: 0
  results_dir: results
  device: auto
  log_every: 25
env:
  family: atari
  params:
    gamma: 0.999          # (5) longer horizon so discounted V spans the whole episode
    max_steps: 0
    frame_skip: 4
    frame_stack: 4
    noop_max: 50
    terminal_on_life_loss: false
    repeat_action_probability: 0.0
    clip_rewards: true
  tasks:
  - game: Pong
    threshold: 18
  - game: Breakout
    threshold: 50
  - game: Boxing
    threshold: 90
  - game: Freeway
    threshold: 30
  - game: SpaceInvaders
    threshold: 600
  - game: Qbert
    threshold: 2000
  - game: Assault
    threshold: 1500
  - game: Krull
    threshold: 4000
  - game: Seaquest
    threshold: 1500
  - game: BeamRider
    threshold: 2500
policy:
  kind: impala_ac_multihead
  hidden_sizes:
  - 512
  task_conditioned: false
duals:
  kind: projected_ascent
  lr: 0.3
  init: 0.0
  max_value: 1000.0
  warm_start: false
trainer:
  kind: ppo
  cycles_per_task: 1
  eps: 0.0025             # (1) strict constraint, 5% relative shortfall
  eval_all_tasks: false
ppo:
  method: consolidate
  expert_dir: experts
  ref_fraction: 1.0
  constraint_greedy: true
  constraint_episodes: 100
  constraint_every: 200
  eval_episodes: 500
  eval_greedy: true
  eval_greedy_episodes: 500
  eval_seed: 100000
  n_envs: 16
  n_steps: 128
  ppo_epochs: 4
  num_minibatches: 4
  clip_ratio: 0.1
  gae_lambda: 0.95
  vf_coef: 0.5
  ent_coef: 0.01
  max_grad_norm: 0.5
  lr: 0.00025
  normalize_advantage: true
  global_iters: 5000     # (4) more constrained optimization
  min_iters: 200
  eval_every: 0
  global_bc_coef: 0.0
  eval_noop_enumerate: true
  constraint_relative: true      # (legacy; ignored when constraint_form=floored)
  constraint_form: floored       # numerically stable additive hinge (no 1/|V_L|)
  constraint_delta: 0.05         # tolerate a 5% drop before the constraint bites
  constraint_tau: 0.5            # floor on |V_L| so near-zero-value tasks keep min slack
  eval_max_ep_steps: 3000
  past_task_sampling: sample
  adapt_iters: 0         # (2) NO unconstrained phase; constraint applies throughout
  warmstart_head_from_expert: true   # (3) keep expert head warm-start
