experiment:
  name: atari_rev_componet_smoke
  seed: 0
  results_dir: results
  device: auto
  log_every: 25
env:
  family: atari
  params:
    gamma: 0.99
    max_steps: 0
    frame_skip: 4
    frame_stack: 4
    noop_max: 50
    terminal_on_life_loss: false
    repeat_action_probability: 0.0
    clip_rewards: true
  tasks:
  - game: SpaceInvaders
    threshold: 800
  - game: Boxing
    threshold: 55
policy:
  kind: componet_cnn
  hidden_sizes:
  - 512
  task_conditioned: false
duals:
  kind: projected_ascent
  lr: 0.3
  init: 0.0
  max_value: 5.0
  warm_start: false
trainer:
  kind: ppo
  cycles_per_task: 1
  eps: 0.04
  eval_all_tasks: false
ppo:
  method: componet
  async_envs: true
  n_envs: 8
  n_steps: 32
  ppo_epochs: 3
  num_minibatches: 4
  clip_ratio: 0.1
  gae_lambda: 0.95
  vf_coef: 0.5
  ent_coef: 0.01
  max_grad_norm: 0.5
  lr: 0.0002
  target_kl: 0.03
  select_best_local: true
  normalize_advantage: true
  task1_iters: 20
  local_iters: 20
  local_iters_per_task:
    SpaceInvaders: 20
    Boxing: 20
  global_iters: 20
  min_iters: 5
  patience: 3
  global_stop_all_tasks: false
  global_retention_frac: 0.7
  stop_eval_every: 10
  stop_eval_episodes: 2
  past_task_sampling: all
  constraint_episodes: 4
  constraint_every: 5
  eval_max_ep_steps: 10000
  eval_noop_enumerate: false
  eval_episodes: 4
  eval_greedy: true
  eval_greedy_episodes: 4
  eval_seed: 100000
  eval_every: 10
