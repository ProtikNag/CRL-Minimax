# Brute-force proof-of-concept of Eq 29 (constrained global update):
#   * values refreshed EVERY iteration  (constraint_every: 1, was 200)
#   * ALL k-1 past environments rolled out every iteration (past_task_sampling: all)
#   * current-task shortfall spans 50 no-op + 50 intermediate states
#   * per-iteration past-task retention monitor (past_monitor_every: 1)
#   * 4 easiest / shortest-rollout games, global_iters 3000, gamma 0.999, 5% floor
# Compute is intentionally maximal ("prove it works first, optimize later").
experiment:
  name: consolidate4_brute
  seed: 0
  results_dir: results
  device: auto
  log_every: 1            # per-iteration value rows so progress is checkable mid-run
env:
  family: atari
  params:
    gamma: 0.999          # long horizon so discounted V spans the whole episode
    max_steps: 0
    frame_skip: 4
    frame_stack: 4
    noop_max: 50
    terminal_on_life_loss: false
    repeat_action_probability: 0.0
    clip_rewards: true
  tasks:                  # 4 easiest / shortest-rollout games (Breakout dropped: longest)
  - game: Pong
    threshold: 18
  - game: Boxing
    threshold: 90
  - game: Freeway
    threshold: 30
  - game: SpaceInvaders
    threshold: 600
policy:
  kind: impala_ac_multihead
  hidden_sizes:
  - 512
  task_conditioned: false
duals:
  kind: projected_ascent
  lr: 0.3
  init: 0.0
  max_value: 1000.0
  warm_start: false
trainer:
  kind: ppo
  cycles_per_task: 1
  eps: 0.0025             # legacy tolerance (ignored under constraint_form=floored)
  eval_all_tasks: false
ppo:
  method: consolidate
  expert_dir: experts
  ref_fraction: 1.0
  constraint_greedy: true
  constraint_episodes: 100
  constraint_every: 1            # (Eq 29) refresh V_k^G / shortfall / mu EVERY iteration
  eval_episodes: 500
  eval_greedy: true
  eval_greedy_episodes: 500
  eval_seed: 100000
  n_envs: 16
  n_steps: 128
  ppo_epochs: 4
  num_minibatches: 4
  clip_ratio: 0.1
  gae_lambda: 0.95
  vf_coef: 0.5
  ent_coef: 0.01
  max_grad_norm: 0.5
  lr: 0.00025
  normalize_advantage: true
  global_iters: 3000            # reduced from 5000
  min_iters: 200
  eval_every: 0                 # retention watched via per-iter global rows + past_monitor
  global_bc_coef: 0.0
  eval_noop_enumerate: true
  constraint_relative: true     # legacy; ignored when constraint_form=floored
  constraint_form: floored      # numerically stable additive hinge (no 1/|V_L|)
  constraint_delta: 0.05        # 5% floor: V_G >= V_L - 0.05*max(|V_L|, tau)
  constraint_tau: 0.5
  expert_refs_path: results/expert_refs_g999_4.json          # 4-game subset (no re-enum)
  constraint_intermediate_states: 50
  constraint_intermediate_path: results/intermediate_states_g999.json
  eval_max_ep_steps: 3000
  past_task_sampling: all       # roll out EVERY past env each iteration (exact Eq 29 sum)
  past_monitor_every: 1         # per-iteration past-task retention monitor (no-op+interm)
  adapt_iters: 0                # constraint applies throughout (no unconstrained phase)
  warmstart_head_from_expert: true
