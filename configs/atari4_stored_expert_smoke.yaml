# SMOKE: tiny stored_expert run (2 games, ~3 iters/phase) to validate plumbing.
experiment:
  name: atari4_stored_expert_smoke
  seed: 0
  results_dir: results
  device: auto
  log_every: 1
env:
  family: atari
  params:
    gamma: 0.99
    max_steps: 0
    frame_skip: 4
    frame_stack: 4
    noop_max: 50
    terminal_on_life_loss: false
    repeat_action_probability: 0.0
    clip_rewards: true
  tasks:
  - game: Pong
    threshold: 18
  - game: Boxing
    threshold: 90
policy:
  kind: impala_ac_multihead
  hidden_sizes:
  - 512
  task_conditioned: false
duals:
  kind: projected_ascent
  lr: 0.3
  init: 0.0
  max_value: 1000.0
  warm_start: false
trainer:
  kind: ppo
  cycles_per_task: 1
  eps: 0.0
  eval_all_tasks: false
ppo:
  method: stored_expert
  expert_dir: experts
  ref_fraction: 1.0
  warmstart_head_from_expert: true
  constraint_greedy: true
  constraint_episodes: 4
  constraint_every: 1
  eval_max_ep_steps: 500
  eval_noop_enumerate: false
  async_envs: true
  n_envs: 8
  n_steps: 128
  ppo_epochs: 2
  num_minibatches: 4
  clip_ratio: 0.1
  gae_lambda: 0.95
  vf_coef: 0.5
  ent_coef: 0.01
  max_grad_norm: 0.5
  lr: 0.00025
  normalize_advantage: true
  global_iters: 3
  min_iters: 0
  eval_episodes: 4
  eval_greedy: true
  eval_greedy_episodes: 4
  eval_seed: 100000
  eval_every: 0
