# Part A -- MIN-MAX (experts NOT stored), FULL 1-seed run.
#   Order: Qbert -> Boxing -> Pong -> Breakout (Freeway replaced by Qbert, the
#   dense-reward game the codebase swapped Freeway for -- safe for vanilla PPO).
#   Per task k: LOCAL phase (plain PPO from theta^0=phi, "properly trained" with a
#   large budget) -> frozen ref V_k^L; GLOBAL phase (PPO + actor-only mu constraint,
#   larger consolidation budget) maximizes past-task value s.t. V_k^G >= V_k^L via
#   the one-sided squared hinge (docs/Updated_Objective_for_CRL.pdf, eqs 26/38/40/47).
#   Reported forgetting matrix = greedy-100. The windowed expert-agreement eval
#   (docs/expert_value_agreement_eval.md, 5000 states/task) is a SEPARATE post-hoc
#   step on the saved checkpoint(s).
experiment:
  name: atari4_v6_full
  seed: 0
  results_dir: results
  device: auto
  log_every: 25
env:
  family: atari
  params:
    gamma: 0.99
    max_steps: 0            # binding rule: no per-episode cap during training
    frame_skip: 4
    frame_stack: 4
    noop_max: 50
    terminal_on_life_loss: false
    repeat_action_probability: 0.0   # required for the snapshot-based eval too
    clip_rewards: true
  tasks:
  - game: Qbert
    threshold: 4000
  - game: Boxing
    threshold: 90
  - game: Pong
    threshold: 18
  - game: Breakout
    threshold: 50
policy:
  kind: impala_ac_multihead
  hidden_sizes:
  - 512
  task_conditioned: false
duals:
  kind: projected_ascent
  lr: 0.3
  init: 0.0
  max_value: 1000.0
  warm_start: false
trainer:
  kind: ppo
  cycles_per_task: 1
  eps: 0.04                 # squared-value tolerance (g^2, g ~ 0.2)
  eval_all_tasks: false     # lower-triangular (seen tasks only) -> cheaper eval
ppo:
  method: constrained
  async_envs: true
  n_envs: 16
  n_steps: 128
  ppo_epochs: 4
  num_minibatches: 4
  clip_ratio: 0.1
  gae_lambda: 0.95
  vf_coef: 0.5
  ent_coef: 0.01
  max_grad_norm: 0.5
  lr: 0.00025
  normalize_advantage: true
  # FULL budgets: local "properly trained", global gets a large consolidation budget.
  task1_iters: 3000         # task 1 (Qbert) plain PPO
  local_iters: 3000         # local phase per new task (was 700)
  global_iters: 2000        # global consolidation per task (was 500)
  min_iters: 500            # floor before early-stop can trigger
  patience: 3
  stop_eval_every: 50
  stop_eval_episodes: 15
  past_task_sampling: all   # exact past-task gradient sum (only <=3 past tasks)
  constraint_episodes: 16   # stochastic MC value for the shortfall (paper-faithful)
  constraint_every: 20
  eval_max_ep_steps: 10000  # eval-only cap (gamma kills the tail); bounds long episodes
  eval_noop_enumerate: false
  # reported eval matrix: greedy-100 (project binding rule)
  eval_episodes: 100
  eval_greedy: true
  eval_greedy_episodes: 100
  eval_seed: 100000
  eval_every: 0
